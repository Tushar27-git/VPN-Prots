# strongSwan classic ipsec.conf - NIST Standard (AES-256-CBC / HMAC-SHA256 / MODP-2048) (responder)
config setup
    charondebug="ike 2, knl 2, cfg 2, esp 2"

conn %default
    keyexchange=ikev2
    authby=secret
    dpdaction=restart
    dpddelay=30s

conn nist_standard_aes_cbc_256
    left=10.10.0.3
    leftid=@responder.lab.local
    leftsubnet=192.168.20.0/24
    right=10.10.0.2
    rightid=@initiator.lab.local
    rightsubnet=192.168.10.0/24
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256-modp2048!
    type=tunnel
    auto=add
