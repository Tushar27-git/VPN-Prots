# strongSwan classic ipsec.conf - Transport Mode Host-to-Host (AES-128-GCM / ECP-256) (responder)
config setup
    charondebug="ike 2, knl 2, cfg 2, esp 2"

conn %default
    keyexchange=ikev2
    authby=secret
    dpdaction=restart
    dpddelay=30s

conn transport_mode_aes_gcm
    left=10.10.0.3
    leftid=@responder.lab.local
    leftsubnet=192.168.20.0/24
    right=10.10.0.2
    rightid=@initiator.lab.local
    rightsubnet=192.168.10.0/24
    ike=aes128gcm16-prfsha256-ecp256!
    esp=aes128gcm16-ecp256!
    type=transport
    auto=add
