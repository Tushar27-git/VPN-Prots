# strongSwan classic ipsec.conf - PQC Hybrid ML-KEM-768 (Quantum Resilient) (responder)
config setup
    charondebug="ike 2, knl 2, cfg 2, esp 2"

conn %default
    keyexchange=ikev2
    authby=secret
    dpdaction=restart
    dpddelay=30s

conn pqc_hybrid_quantum_safe
    left=10.10.0.3
    leftid=@responder.lab.local
    leftsubnet=192.168.20.0/24
    right=10.10.0.2
    rightid=@initiator.lab.local
    rightsubnet=192.168.10.0/24
    ike=aes256-sha384-ecp384-ke1_mlkem768!
    esp=aes256gcm128-sha384-ecp384!
    type=tunnel
    auto=add
