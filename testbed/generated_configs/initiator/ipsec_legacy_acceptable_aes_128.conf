# strongSwan classic ipsec.conf - Acceptable Legacy (AES-128-CBC / No PFS) (initiator)
config setup
    charondebug="ike 2, knl 2, cfg 2, esp 2"

conn %default
    keyexchange=ikev2
    authby=secret
    dpdaction=restart
    dpddelay=30s

conn legacy_acceptable_aes_128
    left=10.10.0.2
    leftid=@initiator.lab.local
    leftsubnet=192.168.10.0/24
    right=10.10.0.3
    rightid=@responder.lab.local
    rightsubnet=192.168.20.0/24
    ike=aes128-sha256-modp2048!
    esp=aes128-sha256!
    type=tunnel
    auto=start
