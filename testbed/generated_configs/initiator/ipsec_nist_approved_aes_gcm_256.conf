# strongSwan classic ipsec.conf - NIST High-Assurance (AES-256-GCM / ECP-384) (initiator)
config setup
    charondebug="ike 2, knl 2, cfg 2, esp 2"

conn %default
    keyexchange=ikev2
    authby=secret
    dpdaction=restart
    dpddelay=30s

conn nist_approved_aes_gcm_256
    left=10.10.0.2
    leftid=@initiator.lab.local
    leftsubnet=192.168.10.0/24
    right=10.10.0.3
    rightid=@responder.lab.local
    rightsubnet=192.168.20.0/24
    ike=aes256gcm16-prfsha384-ecp384!
    esp=aes256gcm16-ecp384!
    type=tunnel
    auto=start
